<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deploy StreamonadRegistry</title>
<style>
  body{font-family:system-ui,sans-serif;background:#0a0a0a;color:#eee;margin:0;padding:16px;max-width:560px;margin-inline:auto}
  button{width:100%;padding:14px;margin:8px 0;border:0;border-radius:10px;background:#7c3aed;color:#fff;font-size:16px}
  button:disabled{opacity:.5}
  pre{background:#171717;border-radius:8px;padding:10px;white-space:pre-wrap;word-break:break-all;font-size:13px}
  small{color:#999}
</style>
</head>
<body>
<h2>Deploy StreamonadRegistry</h2>
<p><small>Temporary helper. Compiles the contract in this browser and sends one deploy transaction from your wallet to Monad testnet (chain 10143). It never asks for a key. Open this page inside your wallet's in-app browser.</small></p>
<button id="go">1. Compile and deploy</button>
<pre id="log">Waiting.</pre>
<script type="text/plain" id="src">// SPDX-License-Identifier: MIT
pragma solidity ^0.8.24;

// forge install OpenZeppelin/openzeppelin-contracts --no-commit
// remappings.txt: @openzeppelin/=lib/openzeppelin-contracts/
import {ERC20} from "@openzeppelin/contracts/token/ERC20/ERC20.sol";

/// @notice Per-agent token. Full supply minted to the creator.
contract AgentToken is ERC20 {
    constructor(string memory n, string memory s, address to, uint256 supply) ERC20(n, s) {
        _mint(to, supply);
    }
}

/// @notice Registry + token factory + tipping in one contract (one tx = agent + token).
contract StreamonadRegistry {
    struct Agent {
        address creator;
        address token;
        uint64 createdAt;
        uint256 totalTips; // native MON, wei
        string name;
        string tagline;
        string personality; // system prompt
        string avatarURI;
    }

    uint256 public constant INITIAL_SUPPLY = 1_000_000_000 ether;

    Agent[] private _agents; // id = index
    mapping(address => uint256[]) private _byCreator;

    event AgentCreated(uint256 indexed id, address indexed creator, address token, string name);
    event Tipped(uint256 indexed id, address indexed from, uint256 amount, string message);

    error EmptyField();
    error NoValue();
    error TransferFailed();
    error BadId();

    function createAgent(
        string calldata name,
        string calldata symbol,
        string calldata tagline,
        string calldata personality,
        string calldata avatarURI
    ) external returns (uint256 id, address token) {
        if (bytes(name).length == 0 || bytes(symbol).length == 0 || bytes(personality).length == 0) {
            revert EmptyField();
        }

        token = address(new AgentToken(name, symbol, msg.sender, INITIAL_SUPPLY));
        id = _agents.length;

        _agents.push(
            Agent({
                creator: msg.sender,
                token: token,
                createdAt: uint64(block.timestamp),
                totalTips: 0,
                name: name,
                tagline: tagline,
                personality: personality,
                avatarURI: avatarURI
            })
        );
        _byCreator[msg.sender].push(id);

        emit AgentCreated(id, msg.sender, token, name);
    }

    /// @notice Tip native MON straight to the agent's creator.
    function tip(uint256 id, string calldata message) external payable {
        if (id >= _agents.length) revert BadId();
        if (msg.value == 0) revert NoValue();

        Agent storage a = _agents[id];
        a.totalTips += msg.value; // effects before interaction

        (bool ok,) = a.creator.call{value: msg.value}("");
        if (!ok) revert TransferFailed();

        emit Tipped(id, msg.sender, msg.value, message);
    }

    // ---------- views ----------

    function agentCount() external view returns (uint256) {
        return _agents.length;
    }

    function getAgent(uint256 id) external view returns (Agent memory) {
        if (id >= _agents.length) revert BadId();
        return _agents[id];
    }

    function getAgentsByCreator(address creator) external view returns (uint256[] memory) {
        return _byCreator[creator];
    }

    /// @notice Paginated list for the public page.
    function getAgents(uint256 start, uint256 limit) external view returns (Agent[] memory out) {
        uint256 n = _agents.length;
        if (start >= n) return new Agent[](0);
        uint256 end = start + limit > n ? n : start + limit;
        out = new Agent[](end - start);
        for (uint256 i = start; i < end; i++) {
            out[i - start] = _agents[i];
        }
    }
}
</script>
<script>
const SOLC = "https://cdn.jsdelivr.net/npm/solc@0.8.26/soljson.js";
const SOLC2 = "https://binaries.soliditylang.org/bin/soljson-v0.8.26+commit.8a97fa7a.js";
const OZ = "https://cdn.jsdelivr.net/npm/@openzeppelin/contracts@5.0.2/";
const CHAIN = {
  chainId: "0x279f",
  chainName: "Monad Testnet",
  nativeCurrency: { name: "Monad", symbol: "MON", decimals: 18 },
  rpcUrls: ["https://testnet-rpc.monad.xyz"],
  blockExplorerUrls: ["https://testnet.monadvision.com"],
};
const logEl = document.getElementById("log");
const log = (m) => { logEl.textContent += "\n" + m; };
const btn = document.getElementById("go");

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = src;
    s.onload = () => res();
    s.onerror = () => rej(new Error("failed to download " + src));
    document.head.appendChild(s);
  });
}

async function loadSolc() {
  for (const u of [SOLC, SOLC2]) {
    log("Downloading compiler from " + new URL(u).host + " (about 8MB, be patient)...");
    let inited = false;
    window.Module = { onRuntimeInitialized() { inited = true; } };
    try { await loadScript(u); } catch (e) { log(e.message); continue; }
    log("Downloaded. Starting compiler (can take 20-60s on a phone)...");
    const t0 = Date.now();
    let beat = 0;
    while (Date.now() - t0 < 120000) {
      const M = window.Module;
      const fn = M && typeof M._solidity_compile === "function";
      if (fn && (inited || M.calledRun || Date.now() - t0 > 10000)) return M;
      if (Date.now() - t0 > beat * 10000) { beat++; log("...still starting (" + Math.round((Date.now() - t0) / 1000) + "s)"); }
      await new Promise((r) => setTimeout(r, 500));
    }
    log("Compiler did not start in 120s from this source.");
  }
  throw new Error("Compiler failed to start. Reload and try again, or use Remix on a laptop.");
}

function resolvePath(from, p) {
  if (!p.startsWith(".")) return p;
  const parts = from.split("/").slice(0, -1);
  for (const seg of p.split("/")) {
    if (seg === "." || seg === "") continue;
    if (seg === "..") parts.pop(); else parts.push(seg);
  }
  return parts.join("/");
}

async function collect(sources, name, content) {
  sources[name] = { content };
  const re = /import\s+(?:[^'"]*?from\s+)?["']([^"']+)["']/g;
  let m;
  while ((m = re.exec(content))) {
    const dep = resolvePath(name, m[1]);
    if (sources[dep]) continue;
    if (!dep.startsWith("@openzeppelin/contracts/")) throw new Error("unexpected import " + dep);
    const url = OZ + dep.replace("@openzeppelin/contracts/", "");
    const r = await fetch(url);
    if (!r.ok) throw new Error("fetch failed " + url);
    await collect(sources, dep, await r.text());
  }
}

async function compile() {
  log("Loading compiler (about 8MB)...");
  const Module = await loadSolc();
  const sources = {};
  await collect(sources, "Streamonad.sol", document.getElementById("src").textContent);
  log("Fetched " + Object.keys(sources).length + " source files. Compiling...");
  const input = {
    language: "Solidity",
    sources,
    settings: {
      optimizer: { enabled: true, runs: 200 },
      evmVersion: "cancun",
      outputSelection: { "*": { "*": ["abi", "evm.bytecode.object"] } },
    },
  };
  const compileFn = Module.cwrap("solidity_compile", "string", ["string", "number", "number"]);
  const out = JSON.parse(compileFn(JSON.stringify(input), 0, 0));
  const errs = (out.errors || []).filter((e) => e.severity === "error");
  if (errs.length) throw new Error(errs.map((e) => e.formattedMessage).join("\n"));
  const c = out.contracts["Streamonad.sol"].StreamonadRegistry;
  return "0x" + c.evm.bytecode.object;
}

async function deploy(data) {
  const eth = window.ethereum;
  if (!eth) throw new Error("No wallet found. Open this page in your wallet's in-app browser.");
  const [from] = await eth.request({ method: "eth_requestAccounts" });
  try {
    await eth.request({ method: "wallet_switchEthereumChain", params: [{ chainId: CHAIN.chainId }] });
  } catch (e) {
    await eth.request({ method: "wallet_addEthereumChain", params: [CHAIN] });
  }
  log("Confirm the transaction in your wallet...");
  const hash = await eth.request({ method: "eth_sendTransaction", params: [{ from, data }] });
  log("Sent: " + hash + "\nhttps://testnet.monadvision.com/tx/" + hash + "\nWaiting for confirmation...");
  for (let i = 0; i < 90; i++) {
    const r = await eth.request({ method: "eth_getTransactionReceipt", params: [hash] });
    if (r) {
      if (r.status !== "0x1") throw new Error("Deploy transaction failed. Hash: " + hash);
      return r.contractAddress;
    }
    await new Promise((res) => setTimeout(res, 2000));
  }
  throw new Error("Timed out waiting for receipt. Check the link above. Hash: " + hash);
}

btn.onclick = async () => {
  btn.disabled = true;
  try {
    const data = await compile();
    log("Compiled. Bytecode " + (data.length - 2) / 2 + " bytes.");
    const addr = await deploy(data);
    log("\nDEPLOYED. Registry address:\n" + addr + "\n\nSend this address back.");
    btn.textContent = "Done";
  } catch (e) {
    log("\nERROR: " + (e && e.message ? e.message : e));
    btn.disabled = false;
  }
};
</script>
</body>
</html>
